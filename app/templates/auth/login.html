<!DOCTYPE html>
<html lang='es'>
	<head>
		<meta charset='UTF-8'>
		<title>Iniciar sesion | HelpDesk</title>
		<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
	</head>

	<style>
		.password-wrapper {
			position: relative;
		}

		.password-wrapper .form-control {
			padding-right: 2.75rem !important;
		}

		.password-toggle {
			position: absolute;
			top: 50%;
			right: .75rem;
			transform: translateY(-50%);
			border: 0;
			background: transparent;
			padding: 0;
			margin: 0;
			color: #6c757d;
			cursor: pointer;
			z-index: 10;
			line-height: 1;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.password-toggle:hover {
			color: #343a40;
		}
	</style>

	<body class='bg-primary bg-gradient' style='min-height:100vh'>
		<div class='d-flex align-items-center justify-content-center min-vh-100'>
			<div class='card shadow' style='width:380px'>
				<div class='card-body p-4'>
					<div class="text-center mb-4">
						<img src="{{ url_for('static', filename='img/logo2.png') }}"
							alt="Logo Sanycces"
							style="max-width: 180px; max-height: 80px; object-fit: contain;">
					</div>
					<h4 class='card-title text-center mb-4'>
						<i class='bi bi-headset text-primary'></i> HelpDesk
					</h4>

					{% with messages = get_flashed_messages(with_categories=true) %}
						{% for category, message in messages %}
							<div class='alert alert-{{ category }}'>{{ message }}</div>
						{% endfor %}
					{% endwith %}

					<form method='POST'>
						<div class='mb-3'>
							<label class='form-label'>Email</label>
							<input type='email' name='email' class='form-control' required autofocus>
						</div>

						<div class="mb-3">
							<label class="form-label">Contraseña</label>
							<div class="password-wrapper">
								<input type="password" id="login_password" name="password" class="form-control pe-5">
								<button type="button" class="password-toggle" onclick="togglePassword('login_password', this)" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
								<i class="bi bi-eye"></i>
								</button>
							</div>
						</div>

						<div class='mb-3 form-check'>
							<input type='checkbox' name='remember' class='form-check-input' id='remember'>
							<label class='form-check-label' for='remember'>Recordarme</label>
						</div>

						<button type='submit' class='btn btn-primary w-100'>Entrar</button>

						<div class="mt-3">
							<a href="{{ url_for('auth.reset_password_request') }}">Restablecer contraseña</a>
						</div>
					</form>
				</div>
			</div>
		</div>

		<link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css' rel='stylesheet'>

		<script>
			function togglePassword(inputId, btn) {
				const input = document.getElementById(inputId);
				const icon = btn.querySelector('i');
				if (!input) return;

				if (input.type === 'password') {
					input.type = 'text';
					if (icon) {
						icon.classList.remove('bi-eye');
						icon.classList.add('bi-eye-slash');
					}
				} else {
					input.type = 'password';
					if (icon) {
						icon.classList.remove('bi-eye-slash');
						icon.classList.add('bi-eye');
					}
				}
			}
		</script>
	</body>
</html>
