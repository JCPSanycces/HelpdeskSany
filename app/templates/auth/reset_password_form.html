{% extends 'auth_base.html' %}

{% block title %}Nueva contraseña{% endblock %}

{% block content %}
<div class="card shadow" style="width:380px">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo2.png') }}"
                 alt="Logo Sanycces"
                 style="max-width: 180px; max-height: 80px; object-fit: contain;">
        </div>

        <h4 class="card-title text-center mb-4">
            <i class="bi bi-key text-primary"></i> Nueva contraseña
        </h4>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="reset_password" name="password" class="form-control pe-5" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('reset_password', this)" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Repetir contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="reset_password2" name="password2" class="form-control pe-5" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('reset_password2', this)" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar</button>

            <div class="mt-3 text-center">
                <a href="{{ url_for('auth.login') }}">Volver al login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
