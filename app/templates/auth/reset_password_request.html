{% extends 'auth_base.html' %}

{% block title %}Restablecer contraseña{% endblock %}

{% block content %}
<div class="card shadow" style="width:380px">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo2.png') }}"
                 alt="Logo Sanycces"
                 style="max-width: 180px; max-height: 80px; object-fit: contain;">
        </div>

        <h4 class="card-title text-center mb-4">
            <i class="bi bi-shield-lock text-primary"></i> Restablecer contraseña
        </h4>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autofocus>
                <div class="form-text">
                    Si existe una cuenta asociada, recibirás un enlace para crear una nueva contraseña.
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>

            <div class="mt-3 text-center">
                <a href="{{ url_for('auth.login') }}">Volver al login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
