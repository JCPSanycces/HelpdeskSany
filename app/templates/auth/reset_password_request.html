{% extends 'base.html' %}
{% block title %}Restablecer contraseña{% endblock %}
{% block content %}

<h4 class="mb-3">Restablecer contraseña</h4>

<form method="POST" class="card p-3" style="max-width:420px;">
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary">Enviar enlace</button>
  <a href="{{ url_for('auth.login') }}" class="btn btn-link">Volver</a>
  <div class="form-text">
    Si no recibes el correo, revisa la carpeta de spam o vuelve a solicitarlo.
  </div>
</form>

{% endblock %}
